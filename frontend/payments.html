<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payments</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav id="nav"></nav>

    <main>
        <div class="card">
            <h1>Record Payment</h1>
            <div id="msg" class="msg"></div>
            <div id="loading" class="loading">Loading...</div>

            <form id="paymentForm">
                <div class="row">
                    <div>
                        <label for="booking">Booking ID</label>
                        <input id="booking" type="number" min="1" required>
                    </div>

                    <div>
                        <label for="amount">Amount</label>
                        <input id="amount" type="number" min="0.01" step="0.01" required>
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label for="method">Payment Method</label>
                        <select id="method" required>
                            <option value="cash">Cash</option>
                            <option value="card">Card</option>
                            <option value="gcash">GCash</option>
                        </select>
                    </div>

                    <div>
                        <label for="kind">Payment Type</label>
                        <select id="kind" required>
                            <option value="payment">Payment</option>
                            <option value="deposit">Deposit</option>
                            <option value="refund">Refund</option>
                            <option value="cancel_fee">Cancellation Fee</option>
                        </select>
                    </div>
                </div>

                <p>
                    <button id="submitBtn" type="submit">Record Payment</button>
                </p>
            </form>
        </div>

        <div class="card">
            <h2>Payments for Booking</h2>
            <div id="paymentList">Enter a Booking ID to view its payments.</div>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>
    <script>
        requireLogin();
        renderNav();

        const $ = (id) => document.getElementById(id);

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function showMsg(message, type) {
            $('msg').textContent = message;
            $('msg').className = type ? 'msg ' + type : 'msg';
        }

        function clearMsg() {
            $('msg').textContent = '';
            $('msg').className = 'msg';
        }

        function setLoading(isLoading) {
            $('loading').classList.toggle('on', isLoading);
        }

        async function loadPayments() {
            const bookingId = $('booking').value.trim();

            if (!bookingId || Number(bookingId) < 1) {
                $('paymentList').textContent = 'Enter a valid Booking ID to view its payments.';
                return;
            }

            setLoading(true);

            try {
                const payments = await api(
                    'GET',
                    '/payments/booking/' + encodeURIComponent(bookingId)
                );

                if (!payments.length) {
                    $('paymentList').textContent = 'No payments recorded for this booking.';
                    return;
                }

                $('paymentList').innerHTML =
                    '<div style="overflow-x:auto;"><table>' +
                    '<thead><tr><th>Payment ID</th><th>Amount</th>' +
                    '<th>Method</th><th>Type</th><th>Date</th></tr></thead><tbody>' +
                    payments.map((payment) =>
                        '<tr><td>' + escapeHtml(payment.id) +
                        '</td><td>' + escapeHtml(payment.amount) +
                        '</td><td>' + escapeHtml(payment.method) +
                        '</td><td>' + escapeHtml(payment.kind) +
                        '</td><td>' + escapeHtml(payment.created_at) + '</td></tr>'
                    ).join('') +
                    '</tbody></table></div>';
            } catch (error) {
                $('paymentList').textContent = error.message;
            } finally {
                setLoading(false);
            }
        }

        $('booking').addEventListener('change', loadPayments);
        $('booking').addEventListener('input', loadPayments);

        $('paymentForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            clearMsg();

            const bookingId = Number($('booking').value);
            const amount = Number($('amount').value);

            if (!bookingId || bookingId < 1) {
                showMsg('Enter a valid Booking ID.');
                return;
            }

            if (!Number.isFinite(amount) || amount <= 0) {
                showMsg('Enter an amount greater than zero.');
                return;
            }

            $('submitBtn').disabled = true;

            try {
                const result = await api('POST', '/payments', {
                    booking_id: bookingId,
                    amount,
                    method: $('method').value,
                    kind: $('kind').value
                });

                showMsg(result.message || 'Payment recorded successfully.', 'success');
                await loadPayments();
            } catch (error) {
                showMsg(error.message, 'error');
            } finally {
                $('submitBtn').disabled = false;
            }
        });
    </script>
</body>

</html>
