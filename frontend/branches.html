<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Branches</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Branches</h1>
    <div id="msg" class="msg"></div>
    <p id="loading" class="loading">Loading...</p>

    <div class="card" id="formCard" style="display:none">
      <h2 id="formTitle">Add branch</h2>
      <div class="row">
        <div><label for="name">Name</label><input id="name" required></div>
        <div><label for="address">Address</label><input id="address" required></div>
        <div><label for="open_time">Opens</label><input id="open_time" type="time" value="09:00"></div>
        <div><label for="close_time">Closes</label><input id="close_time" type="time" value="21:00"></div>
      </div>
      <p>
        <button id="saveBtn">Save</button>
        <button id="cancelBtn" class="secondary" style="display:none">Cancel edit</button>
      </p>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Address</th><th>Opens</th><th>Closes</th><th id="actionsHead"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    requireLogin();
    renderNav();
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const hhmm = (t) => String(t ?? '').slice(0, 5);   // "09:00:00" -> "09:00"
    const isAdmin = getUser()?.role === 'admin';
    let editingId = null;
    let byId = {};

    if (isAdmin) $('formCard').style.display = '';
    else $('actionsHead').style.display = 'none';

    async function load() {
      setLoading(true);
      try {
        const rows = await api('GET', '/branches');
        byId = Object.fromEntries(rows.map((r) => [r.id, r]));
        $('rows').innerHTML = rows.length
          ? rows.map((r) => `<tr>
              <td>${esc(r.name)}</td><td>${esc(r.address)}</td>
              <td>${esc(hhmm(r.open_time))}</td><td>${esc(hhmm(r.close_time))}</td>
              ${isAdmin ? `<td>
                <button data-edit="${r.id}">Edit</button>
                <button class="danger" data-del="${r.id}">Delete</button></td>` : ''}
            </tr>`).join('')
          : '<tr><td colspan="5">No branches yet.</td></tr>';
      } catch (e) {
        showMsg(e.message, 'error', e.errors);
      } finally {
        setLoading(false);
      }
    }

    function resetForm() {
      editingId = null;
      $('formTitle').textContent = 'Add branch';
      $('name').value = ''; $('address').value = '';
      $('open_time').value = '09:00'; $('close_time').value = '21:00';
      $('cancelBtn').style.display = 'none';
    }

    $('saveBtn').addEventListener('click', async () => {
      clearMsg();
      const body = {
        name: $('name').value, address: $('address').value,
        open_time: $('open_time').value, close_time: $('close_time').value,
      };
      try {
        await api(editingId ? 'PUT' : 'POST', editingId ? '/branches/' + editingId : '/branches', body);
        const wasEdit = !!editingId;
        resetForm();
        await load();
        showMsg(wasEdit ? 'Branch updated' : 'Branch created', 'success');
      } catch (e) {
        showMsg(e.message, 'error', e.errors);
      }
    });

    $('cancelBtn').addEventListener('click', () => { resetForm(); clearMsg(); });

    $('rows').addEventListener('click', async (ev) => {
      const editId = ev.target.dataset.edit;
      const delId = ev.target.dataset.del;
      if (editId) {
        const r = byId[editId];
        editingId = r.id;
        $('formTitle').textContent = 'Edit branch #' + r.id;
        $('name').value = r.name; $('address').value = r.address;
        $('open_time').value = hhmm(r.open_time); $('close_time').value = hhmm(r.close_time);
        $('cancelBtn').style.display = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      if (delId && confirm('Delete this branch?')) {
        clearMsg();
        try {
          await api('DELETE', '/branches/' + delId);
          await load();
          showMsg('Branch deleted', 'success');
        } catch (e) {
          showMsg(e.message, 'error', e.errors);
        }
      }
    });

    load();
  </script>
</body>
</html>
