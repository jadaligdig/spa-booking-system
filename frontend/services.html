<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Services</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="nav"></nav>
  <main>
    <h1>Services</h1>
    <div id="msg" class="msg"></div>
    <p id="loading" class="loading">Loading...</p>

    <div class="card" id="formCard" style="display:none">
      <h2 id="formTitle">Add service</h2>
      <div class="row">
        <div><label for="name">Name</label><input id="name" required></div>
        <div><label for="category_id">Category</label><select id="category_id"></select></div>
        <div><label for="duration_min">Duration (minutes)</label><input id="duration_min" type="number" min="1" value="60"></div>
        <div><label for="cleanup_min">Cleanup time (minutes)</label><input id="cleanup_min" type="number" min="0" value="10"></div>
        <div><label for="price">Price</label><input id="price" type="number" min="0" step="0.01" value="0"></div>
      </div>
      <p>
        <button id="saveBtn">Save</button>
        <button id="cancelBtn" class="secondary" style="display:none">Cancel edit</button>
      </p>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Category</th><th>Duration</th><th>Cleanup</th><th>Price</th><th id="actionsHead"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>Categories (with number of services)</h2>
      <table>
        <thead><tr><th>Category</th><th>Description</th><th>Services</th></tr></thead>
        <tbody id="catRows"></tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    requireLogin();
    renderNav();
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const isAdmin = getUser()?.role === 'admin';
    let editingId = null;
    let byId = {};

    if (isAdmin) $('formCard').style.display = '';
    else $('actionsHead').style.display = 'none';

    async function load() {
      setLoading(true);
      try {
        const [cats, services] = await Promise.all([api('GET', '/categories'), api('GET', '/services')]);

        const current = $('category_id').value;
        $('category_id').innerHTML = cats.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
        if (current) $('category_id').value = current;

        // LEFT JOIN result: categories with 0 services still show up
        $('catRows').innerHTML = cats.map((c) =>
          `<tr><td>${esc(c.name)}</td><td>${esc(c.description)}</td><td>${c.service_count}</td></tr>`).join('');

        byId = Object.fromEntries(services.map((s) => [s.id, s]));
        $('rows').innerHTML = services.length
          ? services.map((s) => `<tr>
              <td>${esc(s.name)}</td><td>${esc(s.category_name ?? '-')}</td>
              <td>${s.duration_min} min</td><td>${s.cleanup_min} min</td>
              <td>${Number(s.price).toFixed(2)}</td>
              ${isAdmin ? `<td>
                <button data-edit="${s.id}">Edit</button>
                <button class="danger" data-del="${s.id}">Delete</button></td>` : ''}
            </tr>`).join('')
          : '<tr><td colspan="6">No services yet.</td></tr>';
      } catch (e) {
        showMsg(e.message, 'error', e.errors);
      } finally {
        setLoading(false);
      }
    }

    function resetForm() {
      editingId = null;
      $('formTitle').textContent = 'Add service';
      $('name').value = '';
      $('duration_min').value = 60; $('cleanup_min').value = 10; $('price').value = 0;
      $('cancelBtn').style.display = 'none';
    }

    $('saveBtn').addEventListener('click', async () => {
      clearMsg();
      const body = {
        name: $('name').value,
        category_id: Number($('category_id').value),
        duration_min: Number($('duration_min').value),
        cleanup_min: Number($('cleanup_min').value),
        price: Number($('price').value),
      };
      try {
        await api(editingId ? 'PUT' : 'POST', editingId ? '/services/' + editingId : '/services', body);
        const wasEdit = !!editingId;
        resetForm();
        await load();
        showMsg(wasEdit ? 'Service updated' : 'Service created', 'success');
      } catch (e) {
        showMsg(e.message, 'error', e.errors);
      }
    });

    $('cancelBtn').addEventListener('click', () => { resetForm(); clearMsg(); });

    $('rows').addEventListener('click', async (ev) => {
      const editId = ev.target.dataset.edit;
      const delId = ev.target.dataset.del;
      if (editId) {
        const s = byId[editId];
        editingId = s.id;
        $('formTitle').textContent = 'Edit service #' + s.id;
        $('name').value = s.name;
        $('category_id').value = s.category_id;
        $('duration_min').value = s.duration_min;
        $('cleanup_min').value = s.cleanup_min;
        $('price').value = s.price;
        $('cancelBtn').style.display = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      if (delId && confirm('Delete this service?')) {
        clearMsg();
        try {
          await api('DELETE', '/services/' + delId);
          await load();
          showMsg('Service deleted', 'success');
        } catch (e) {
          showMsg(e.message, 'error', e.errors);
        }
      }
    });

    load();
  </script>
</body>
</html>
