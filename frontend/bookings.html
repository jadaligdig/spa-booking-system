<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bookings</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <nav id="nav"></nav>

    <main>
        <div class="card">
            <h1>Create Booking</h1>
            <div id="msg" class="msg"></div>
            <div id="loading" class="loading">Loading...</div>

            <div class="row">
                <div>
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div>
                    <label for="branch">Branch</label>
                    <select id="branch" required></select>
                </div>
                <div>
                    <label for="service">Service</label>
                    <select id="service" required></select>
                </div>
            </div>

            <p>
                <button id="searchBtn" type="button">Find Available Slots</button>
            </p>

            <h2>Available Slots</h2>
            <div id="results"></div>

            <form id="bookingForm" hidden>
                <h2>Booking Details</h2>
                <div class="row">
                    <div>
                        <label for="customerId">Customer</label>
                        <select id="customerId" required></select>
                    </div>
                    <div>
                        <label for="notes">Notes</label>
                        <input id="notes" type="text">
                    </div>
                </div>

                <p id="selectedSlot"></p>
                <button id="submitBtn" type="submit">Create Booking</button>
            </form>
        </div>

        <div class="card">
            <h2>My Bookings</h2>
            <div id="bookingList"></div>
            <p>
                <button id="refreshBtn" type="button">Refresh Bookings</button>
            </p>
        </div>

        <div class="card">
            <h2>Record Payment</h2>
            <div id="paymentMsg" class="msg"></div>

            <form id="paymentForm">
                <div class="row">
                    <div>
                        <label for="paymentBooking">Booking</label>
                        <select id="paymentBooking" required></select>
                    </div>
                    <div>
                        <label for="amount">Amount</label>
                        <input id="amount" type="number" min="0.01" step="0.01" required>
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label for="method">Payment Method</label>
                        <select id="method" required>
                            <option value="cash">Cash</option>
                            <option value="card">Card</option>
                            <option value="gcash">GCash</option>
                        </select>
                    </div>
                    <div>
                        <label for="kind">Payment Kind</label>
                        <select id="kind" required>
                            <option value="deposit">Deposit</option>
                            <option value="payment">Payment</option>
                        </select>
                    </div>
                </div>

                <p>
                    <button id="paymentBtn" type="submit">Record Payment</button>
                </p>
            </form>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/nav.js"></script>

    <script>
        requireLogin();
        renderNav();

        const $ = (id) => document.getElementById(id);
        let selectedSlot = null;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function formatError(error) {
            const details = Array.isArray(error.errors)
                ? error.errors.join('; ')
                : '';

            return error.message + (details ? ' - ' + details : '');
        }

        function showMsg(message, type) {
            $('msg').textContent = message;
            $('msg').className = type ? 'msg ' + type : 'msg';
        }

        function clearMsg() {
            $('msg').textContent = '';
            $('msg').className = 'msg';
        }

        function showPaymentMsg(message, type) {
            $('paymentMsg').textContent = message;
            $('paymentMsg').className = type ? 'msg ' + type : 'msg';
        }

        function setLoading(isLoading) {
            $('loading').classList.toggle('on', isLoading);
        }

        function setToday() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');

            $('date').value = year + '-' + month + '-' + day;
            $('date').min = $('date').value;
        }

        // LOAD BRANCHES, SERVICES, AND CUSTOMERS
        async function loadOptions() {
            setLoading(true);
            clearMsg();

            try {
                const branches = await api('GET', '/branches');
                const services = await api('GET', '/availability/services');
                const customers = await api('GET', '/customers');

                $('branch').innerHTML = branches.map((branch) =>
                    '<option value="' + branch.id + '">' +
                    escapeHtml(branch.name) + '</option>'
                ).join('');

                $('service').innerHTML = services.map((service) =>
                    '<option value="' + service.id + '">' +
                    escapeHtml(service.name) + ' (' +
                    escapeHtml(service.duration_min) + ' minutes)</option>'
                ).join('');

                $('customerId').innerHTML = customers.map((customer) =>
                    '<option value="' + customer.id + '">' +
                    escapeHtml(customer.full_name) + '</option>'
                ).join('');

                if (!branches.length || !services.length) {
                    showMsg('No active branches or services found.', 'error');
                }

                if (!customers.length) {
                    showMsg('No customers found. Add a customer first.', 'error');
                }
            } catch (error) {
                showMsg(formatError(error), 'error');
            } finally {
                setLoading(false);
            }
        }

        // FIND AVAILABLE SLOTS
        async function findSlots() {
            clearMsg();
            $('results').innerHTML = '';
            $('bookingForm').hidden = true;
            selectedSlot = null;

            const date = $('date').value;
            const branchId = $('branch').value;
            const serviceId = $('service').value;

            if (!date || !branchId || !serviceId) {
                showMsg('Please select a date, branch, and service.', 'error');
                return;
            }

            setLoading(true);

            try {
                const slots = await api(
                    'GET',
                    '/availability?date=' + encodeURIComponent(date) +
                    '&branch_id=' + encodeURIComponent(branchId) +
                    '&service_id=' + encodeURIComponent(serviceId)
                );

                if (!Array.isArray(slots) || !slots.length) {
                    $('results').textContent = 'No available slots found.';
                    return;
                }

                $('results').innerHTML =
                    '<div style="overflow-x:auto;"><table>' +
                    '<thead><tr><th>Therapist</th><th>Room</th>' +
                    '<th>Start</th><th>End</th><th></th></tr></thead><tbody>' +
                    slots.map((slot, index) =>
                        '<tr>' +
                        '<td>' + escapeHtml(slot.therapist.full_name) + '</td>' +
                        '<td>' + escapeHtml(slot.room.name) + '</td>' +
                        '<td>' + escapeHtml(slot.start_at) + '</td>' +
                        '<td>' + escapeHtml(slot.end_at) + '</td>' +
                        '<td><button type="button" data-slot="' +
                        index + '">Select</button></td></tr>'
                    ).join('') +
                    '</tbody></table></div>';

                $('results').querySelectorAll('[data-slot]').forEach((button) => {
                    button.addEventListener('click', () => {
                        selectedSlot = slots[Number(button.dataset.slot)];
                        $('bookingForm').hidden = false;
                        $('selectedSlot').textContent =
                            'Selected: ' + selectedSlot.start_at +
                            ', ' + selectedSlot.therapist.full_name +
                            ', ' + selectedSlot.room.name;
                    });
                });
            } catch (error) {
                showMsg(formatError(error), 'error');
            } finally {
                setLoading(false);
            }
        }

        // LOAD BOOKINGS
        async function loadBookings() {
            try {
                const bookings = await api('GET', '/bookings');

                if (!Array.isArray(bookings)) {
                    throw new Error('Invalid bookings response from server.');
                }

                if (!bookings.length) {
                    $('bookingList').textContent = 'No bookings found.';
                } else {
                    $('bookingList').innerHTML =
                        '<div style="overflow-x:auto;"><table>' +
                        '<thead><tr><th>ID</th><th>Customer</th><th>Service</th>' +
                        '<th>Therapist</th><th>Room</th><th>Start</th>' +
                        '<th>Status</th></tr></thead><tbody>' +
                        bookings.map((booking) =>
                            '<tr>' +
                            '<td>' + escapeHtml(booking.id) + '</td>' +
                            '<td>' + escapeHtml(booking.customer_name) + '</td>' +
                            '<td>' + escapeHtml(booking.service_name) + '</td>' +
                            '<td>' + escapeHtml(booking.therapist_name) + '</td>' +
                            '<td>' + escapeHtml(booking.room_name) + '</td>' +
                            '<td>' + escapeHtml(booking.start_at) + '</td>' +
                            '<td>' + escapeHtml(booking.status) + '</td></tr>'
                        ).join('') +
                        '</tbody></table></div>';
                }

                $('paymentBooking').innerHTML = bookings.map((booking) =>
                    '<option value="' + booking.id + '">' +
                    'Booking #' + escapeHtml(booking.id) +
                    ' - ' + escapeHtml(booking.customer_name) +
                    ' - ' + escapeHtml(booking.service_name) + '</option>'
                ).join('');

                if (!bookings.length) {
                    $('paymentBooking').innerHTML =
                        '<option value="">No bookings available</option>';
                }
            } catch (error) {
                $('bookingList').textContent = formatError(error);
            }
        }

        // CREATE BOOKING
        $('bookingForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            clearMsg();

            if (!selectedSlot) {
                showMsg('Select an available slot first.', 'error');
                return;
            }

            const customerId = Number($('customerId').value);

            if (!customerId || customerId < 1) {
                showMsg('Please select a customer.', 'error');
                return;
            }

            $('submitBtn').disabled = true;

            const booking = {
                customer_id: customerId,
                service_id: Number($('service').value),
                therapist_id: selectedSlot.therapist.id,
                room_id: selectedSlot.room.id,
                start_at: selectedSlot.start_at,
                notes: $('notes').value || null
            };

            try {
                await api('POST', '/bookings', booking);

                $('bookingForm').reset();
                $('bookingForm').hidden = true;
                selectedSlot = null;

                await loadBookings();
                await findSlots();

                // Show success only after the reloads.
                showMsg('Booking created successfully.', 'success');
            } catch (error) {
                // Show the server message and any conflict reasons.
                showMsg(formatError(error), 'error');
            } finally {
                $('submitBtn').disabled = false;
            }
        });

        // RECORD PAYMENT
        $('paymentForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            showPaymentMsg('', '');

            const bookingId = Number($('paymentBooking').value);
            const amount = Number($('amount').value);
            const method = $('method').value;
            const kind = $('kind').value;

            if (!bookingId) {
                showPaymentMsg('Please select a booking.', 'error');
                return;
            }

            if (!Number.isFinite(amount) || amount <= 0) {
                showPaymentMsg('Amount must be greater than zero.', 'error');
                return;
            }

            $('paymentBtn').disabled = true;

            try {
                await api('POST', '/payments', {
                    booking_id: bookingId,
                    amount,
                    method,
                    kind
                });

                $('paymentForm').reset();
                showPaymentMsg('Payment recorded successfully.', 'success');
            } catch (error) {
                showPaymentMsg(formatError(error), 'error');
            } finally {
                $('paymentBtn').disabled = false;
            }
        });

        $('searchBtn').addEventListener('click', findSlots);
        $('refreshBtn').addEventListener('click', loadBookings);

        setToday();
        loadOptions();
        loadBookings();
    </script>
</body>

</html>
