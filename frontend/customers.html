<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Management - SPA Booking</title>
  <link rel="stylesheet" href="/css/style.css">

  <style>
    /* Only maps this page's existing class names onto the shared look in css/style.css */
    .navbar { background: var(--brand-dark); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    .navbar a { color: #fff; text-decoration: none; font-size: 14px; }
    .navbar a:hover, .navbar a.active { text-decoration: underline; }
    .navbar .brand { color: var(--ink); font-weight: bold; }
    .navbar .spacer { flex: 1; }
    .navbar #nav-user { color: var(--ink); font-size: 14px; }

    .main-container { max-width: 960px; margin: 20px auto; padding: 0 16px; }
    .main-container > h2 { font-size: 22px; margin: 0 0 12px; }
    .card h3 { font-size: 17px; margin: 0 0 10px; }

    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }

    .btn-secondary { background: #8a8a8a; margin-left: 5px; }
    .btn-secondary:hover { background: #6f6f6f; }
    .btn-delete { background: var(--danger); }
    .btn-delete:hover { background: #8f3324; }
  </style>
</head>

<body>

  <div class="navbar">
    <span class="brand">SPA Booking</span>
    <a href="customers.html" class="active">Customers</a>
    <a href="branches.html">Branches</a>
    <a href="services.html">Services</a>
    <a href="bookings.html">Bookings</a>
    <a href="availability.html">Availability</a>
    <a href="alerts.html">Alerts & Audit</a>
    <a href="reports.html">Reports</a>
    <span class="spacer"></span>
    <span id="nav-user"></span>
    <a href="#" id="logoutBtn">Logout</a>
  </div>

  <div class="main-container">
    <h2>Customers</h2>

    <div class="card">
      <h3 id="form-title">Add customer</h3>

      <form id="customer-form">
        <input type="hidden" id="customer-id">

        <div class="form-row">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="Enter full name">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter email address">
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" required placeholder="Enter phone number">
          </div>
        </div>

        <button type="submit" class="btn">Save</button>
        <button type="button" id="cancel-btn" class="btn btn-secondary" style="display: none;">Cancel</button>
      </form>
    </div>

    <div class="card">
      <table id="customers-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th style="width: 130px;">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/customers.js"></script>
  <script>
    (function () {
      var user = null;
      try { user = JSON.parse(localStorage.getItem('user') || 'null'); } catch (e) {}
      document.getElementById('nav-user').textContent = user ? user.full_name + ' (' + user.role + ')' : '';
      document.getElementById('logoutBtn').addEventListener('click', function (e) {
        e.preventDefault();
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = '/index.html';
      });
    })();
  </script>
</body>

</html>
